name: Build MythicArsenal Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Plugin (.jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: |
          if [ -f "pom.xml" ]; then
            mvn -B clean package
            mkdir -p build-out
            find target -maxdepth 1 -name "*.jar" ! -name "original-*.jar" -exec cp {} build-out/ \;
          elif [ -f "MythicArsenal/pom.xml" ]; then
            mvn -B -f MythicArsenal/pom.xml clean package
            mkdir -p build-out
            find MythicArsenal/target -maxdepth 1 -name "*.jar" ! -name "original-*.jar" -exec cp {} build-out/ \;
          else
            echo "pom.xml nahi mila!"
            exit 1
          fi

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MythicArsenal-Plugin
          path: build-out/*.jar

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-out/*.jar
