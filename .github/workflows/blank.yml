name: Build MythicArsenal JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Find pom.xml and Compile JAR
        run: |
          POM_FILE=$(find . -name "pom.xml" -print -quit)
          if [ -z "$POM_FILE" ]; then
            echo "ERROR: Repository mein kahin bhi pom.xml file nahi mili!"
            exit 1
          fi
          echo "Found pom.xml at: $POM_FILE"
          mvn -B -f "$POM_FILE" clean package

      - name: Upload Compiled Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MythicArsenal-2.2.0-JAR
          path: '**/target/*.jar'
